# Blueprint de Render para el servicio Python de IA de SpatialValue.
# Al pushear este archivo a main, Render crea/actualiza el servicio automáticamente.
# Después del primer deploy hay que pegar el valor de SpatialValueStorage_DATABASE_URL
# (lo pedimos con "sync: false", o lo seteas en Dashboard > Environment).
services:
  - type: web
    name: spatial-value-ia
    runtime: python
    plan: free
    rootDir: src/pages/Apis
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_ia:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SpatialValueStorage_DATABASE_URL
        sync: false
      - key: SpatialValueStorage_DATABASE_URL_UNPOOLED
        sync: false
