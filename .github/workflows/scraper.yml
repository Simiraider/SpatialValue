name: Ejecutar Scraper Automatico

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm install

    - name: Instalar Navegador Playwright
      run: npx playwright install chromium

    - name: Correr el Scraper
      env:
        SpatialValueStorage_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: node LicenciadoScraper.js